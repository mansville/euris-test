name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  maven:
    name: Test & Package
    runs-on: ubuntu-22.04

    services:
      database:
        image: postgres:18-alpine
        ports: [ "5432:5432" ]
        env:
          POSTGRES_DB: euris
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-timeout 5s
          --health-interval 10s
          --health-retries 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Wrapper
        run: chmod +x mvnw
      - name: Jar
        run: ./mvnw clean package
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact
          path: target/app.jar

  github:
    name: Tag & Release
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: maven
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag
        id: tag
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: artifact
          path: target
      - name: Dist
        run: |-
          mkdir dist
          cp target/app.jar dist/app-${{ steps.tag.outputs.new_tag }}.jar
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.tag.outputs.new_tag }}
          tag_name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: dist/*